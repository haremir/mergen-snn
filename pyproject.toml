[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mergen-snn"
version = "0.1.0"
description = "Mergen — CPU-friendly, extensible Spiking Neural Network language model focused on Computer Science"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "torch-directml; sys_platform == 'win32'",
    "snntorch",
    "numpy",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "requests",
    "beautifulsoup4",
    "lxml",
    "pypdf",
    "tokenizers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/mergen"]
