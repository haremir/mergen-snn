defaults:
  - default

device:
  prefer: cpu

data:
  name: bpe_lm
  block_size: 32
  batch_size: 128
  train_bin: data/processed/bpe_train.bin
  val_bin: data/processed/bpe_val.bin
  tokenizer_path: data/processed/tokenizer_bpe.json

model:
  name: bpe_snn_lm
  vocab_size: 8192
  embed_dim: 384
  hidden_size: 384
  beta: 0.9
  num_steps: 32
  tie_weights: false

training:
  epochs: 5
  learning_rate: 0.0003
  optimizer: adam
  warmup_steps: 200
  clip_grad_norm: 1.0
  max_steps_per_epoch: null
  log_every: 500
  early_stop_patience: 3000
  checkpoint_dir: checkpoints
  chars_per_token: 3.29
  resume: false

generation:
  max_new_tokens: 60
  temperature: 0.8
  top_k: 40
  top_p: 0.9
