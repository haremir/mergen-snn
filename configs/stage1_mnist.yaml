defaults:
  - default

data:
  name: mnist
  batch_size: 128
  num_workers: 0  # Windows'ta 0 en güvenli

model:
  input_size: 784
  hidden_size: 100
  output_size: 10
  beta: 0.9        # LIF decay oranı
  num_steps: 25    # zaman adımı

training:
  epochs: 1
  learning_rate: 0.001
  optimizer: sgd        # adam | sgd — MNIST: SGD ve Adam eşdeğer; SGD'de DirectML CPU fallback yok
  foreach: false         # DirectML: lerp CPU fallback'ini önler
  momentum: 0.9          # sadece sgd için

encoding:
  type: poisson
  max_rate: 1.0
