data:
  block_size: 128
  batch_size: 8 # 100M model, VRAM sınırı
  train_bin: data/processed/bpe_train_v3b.bin # TAM VERİ, 1.84B token
  val_bin: data/processed/bpe_val_v3b.bin
  use_streaming: true # Colab'de disk/RAM tasarrufu için streaming (memmap)
  num_workers: 0
  pin_memory: false

model:
  name: hybrid_lif_attn
  vocab_size: 16384
  embed_dim: 512
  hidden_size: 512
  num_blocks: 8
  num_heads: 8
  ffn_hidden: 1024
  max_seq: 128
  beta: 0.9
  threshold: 0.5

training:
  epochs: 1 # Önce 1 epoch (1.8M adım). PPL < 500 ise 2. epoch.
  learning_rate: 0.0003
  optimizer: adam
  warmup_steps: 500
  checkpoint_every: 2000
  resume: auto
  checkpoint_dir: checkpoints
  device: cuda
  max_steps_per_epoch: null
  log_every: 100
  clip_grad_norm: 1.0
  spike_reg_weight: 0.0 # V spike doğal, ceza gerekmez
  target_spike: 0.20
